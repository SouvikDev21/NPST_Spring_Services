server.port=8765
spring.application.name=API-GATEWAY

logging.level.org.springframework.cloud.gateway=TRACE

# --- Routes ---
spring.cloud.gateway.server.webflux.routes[0].id=question-service
spring.cloud.gateway.server.webflux.routes[0].uri=lb://QUESTION-SERVICE
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/question/**

spring.cloud.gateway.server.webflux.routes[1].id=quiz-service
spring.cloud.gateway.server.webflux.routes[1].uri=lb://QUIZ-SERVICE
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/quiz/**

spring.cloud.gateway.server.webflux.routes[2].id=FUND-TRANSFER
spring.cloud.gateway.server.webflux.routes[2].uri=lb://FUND-TRANSFER
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/fund-transfer/**,/api/v1/beneficiaries/**,/api/v1/ifsc/**

# --- Eureka client (required for lb:// routes to resolve) ---
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.fetch-registry=true
eureka.client.register-with-eureka=true
eureka.instance.prefer-ip-address=true

# --- Security: JWT validation via Keycloak (fixes the ReactiveJwtDecoder error) ---
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8080/realms/bank

# --- Actuator (optional, useful for local dev) ---
management.endpoints.web.exposure.include=health,info,gateway