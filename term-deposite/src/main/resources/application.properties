# Server Port (To avoid clashing with other microservices)
server.port=8080

# Database Connection (Pointing to your new Docker container)
spring.datasource.url=jdbc:mysql://localhost:3306/term_deposit_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate / JPA Settings (This tells Spring to auto-create your tables!)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect