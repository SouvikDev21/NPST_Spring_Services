server:
  port: 8081

spring:
  application:
    name: account-service
  datasource:
    url: jdbc:h2:mem:account_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: false
  flyway:
    enabled: false
  h2:
    console:
      enabled: true
      path: /h2-console
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

springdoc:
  swagger-ui:
    path: /swagger-ui.html

cbs:
  base-url: ${CBS_BASE_URL}
  channel-id: ${CBS_CHANNEL_ID}
  user-id: ${CBS_USER_ID}
  branch-code: ${CBS_BRANCH_CODE}
  connect-timeout-ms: 5000
  read-timeout-ms: 10000

keycloak:
  url: ${KEYCLOAK_URL}
  realm: ${KEYCLOAK_REALM}
  issuer-uri: ${KEYCLOAK_ISSUER_URI}
  client-id: ${KEYCLOAK_CLIENT_ID}
  client-secret: ${KEYCLOAK_CLIENT_SECRET}
  claim-cif-key: cif
  clients:
    admin-web: ${KEYCLOAK_CLIENT_ADMIN_WEB}
    mobile-app: ${KEYCLOAK_CLIENT_MOBILE_APP}
