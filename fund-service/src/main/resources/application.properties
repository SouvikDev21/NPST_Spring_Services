spring.application.name=fund-transfer
app.test.cif=TEST-CIF-001
spring.profiles.active=local
server.port=8083

# ---------------------------------------------------------------------------
# Keycloak / OAuth2 Resource Server
# ---------------------------------------------------------------------------
# issuer-uri = <keycloak-base-url>/realms/<realm-name>
# e.g. http://localhost:8080/realms/bharatbank
# Spring Security calls <issuer-uri>/.well-known/openid-configuration on
# startup to discover the JWKS endpoint and validate that the "iss" claim
# on every incoming token matches this value.
# CHANGE THIS to your real Keycloak host/realm before running.
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/bharatbank}

# If this service can't reach Keycloak's /.well-known endpoint at startup
# (e.g. Keycloak isn't reachable from wherever this app boots, only the
# JWKS URL is), comment out issuer-uri above and use jwk-set-uri instead:
# spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_JWKS_URI:http://localhost:8080/realms/bharatbank/protocol/openid-connect/certs}

spring.datasource.url=jdbc:h2:mem:funddb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ---------------------------------------------------------------------------
# OTP service — used to verify the customer before a beneficiary is created
# ---------------------------------------------------------------------------
otp.base-url=${OTP_SERVICE_BASE_URL:http://103.209.145.243:9101}
otp.send-path=/api/v1/app/auth/otp/send
otp.verify-path=/api/v1/app/auth/otp/verify
otp.add-beneficiary-purpose=ADD_BENEFICIARY
otp.connect-timeout-ms=3000
otp.read-timeout-ms=8000

# ---------------------------------------------------------------------------
# OpenFeign — used for the OTP client (Otp/OtpFeignClient) and the IFSC
# lookup client (ifsc/IfscFeignClient). OTP's timeouts come from
# otp.connect-timeout-ms / otp.read-timeout-ms above via OtpFeignClientConfig;
# ifscService's timeouts are set here directly since IfscFeignClient has no
# equivalent properties class (same 3s/5s that IfscConfig used to set on the
# old RestTemplate).
# ---------------------------------------------------------------------------
spring.cloud.openfeign.client.config.ifscService.connect-timeout=3000
spring.cloud.openfeign.client.config.ifscService.read-timeout=5000

app.security.mock-auth-enabled=true
app.security.mock-auth-subject=local-dev-user
app.security.mock-auth-roles=RETAIL_CUSTOMER
otp.mock-enabled=true

# =========================
# MySQL Datasource
# =========================
spring.config.import=optional:file:.env.properties

spring.datasource.url=jdbc:mysql://localhost:3306/db1

spring.datasource.username=root
spring.datasource.password=supersecretrootpassword
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP connection pool (auto-used since it's bundled with spring-boot-starter-data-jpa)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000

# =========================
# JPA / Hibernate
# =========================
# "update" auto-alters tables to match entities \u2014 fine for local dev,
# switch to "validate" or "none" once you add Flyway/Liquibase migrations.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# =========================
# CBS integration (from earlier setup)
# =========================
cbs.base-url=http://103.209.145.243:9101/cbs/v3
cbs.balance-inquiry-path=/accounts/{accountId}/details
cbs.debit-path=/accounts/debit
cbs.reversal-path=/accounts/reverse
cbs.connect-timeout-ms=3000
cbs.read-timeout-ms=8000
cbs.api-key-header-name=X-API-Key
cbs.api-key=${CBS_API_KEY:}

# =========================
# Active profile
# =========================
# "local"/"dev"/"test" activates MockCbsClient/MockNpciClient (see @Profile
# annotations on those classes). Switch to "prod"/"uat"/"staging" to activate
# the real CbsRestClient instead.
spring.profiles.active=local
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://103.209.145.243:8201/realms/bharat-banking
