# =========================
# MySQL Datasource
# =========================
spring.config.import=optional:file:.env.properties

spring.datasource.url=jdbc:mysql://103.209.145.243:9100/fund_transfer

spring.datasource.username=souvik
spring.datasource.password=souvik-npst-ultra-pro-max
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP connection pool (auto-used since it's bundled with spring-boot-starter-data-jpa)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000

# =========================
# JPA / Hibernate
# =========================
# "update" auto-alters tables to match entities \u2014 fine for local dev,
# switch to "validate" or "none" once you add Flyway/Liquibase migrations.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# =========================
# CBS integration (from earlier setup)
# =========================
cbs.base-url=http://103.209.145.243:9101/cbs/v3
cbs.balance-inquiry-path=/accounts/{accountId}/details
cbs.debit-path=/accounts/debit
cbs.reversal-path=/accounts/reverse
cbs.connect-timeout-ms=3000
cbs.read-timeout-ms=8000
cbs.api-key-header-name=X-API-Key
cbs.api-key=${CBS_API_KEY:}

# =========================
# Active profile
# =========================
# "local"/"dev"/"test" activates MockCbsClient/MockNpciClient (see @Profile
# annotations on those classes). Switch to "prod"/"uat"/"staging" to activate
# the real CbsRestClient instead.
spring.profiles.active=local